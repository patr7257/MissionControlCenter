# Build config for the Mission Control Center desktop app (Windows MSI).
# The MSI upgradeCode below must NEVER change: Windows uses it to recognise the
# product across versions so a newer MSI upgrades in place instead of installing
# a second copy.
# appId keeps the original claude-mission-control slug on purpose: together with
# upgradeCode it is the MSI upgrade identity, so changing it would break in-place
# upgrades for already-installed apps. It is not user-visible.
appId: dk.zrm.claude-mission-control
productName: Mission Control Center
directories:
  output: dist
  buildResources: build
asar: false
files:
  # "*.mjs" (not an explicit list) for the same reason extraResources below uses
  # a glob: 0.1.10 shipped dead because installer-cmd.mjs was added and imported
  # from main.mjs but not added here, so the packaged app crashed with
  # ERR_MODULE_NOT_FOUND while the repo copy and every CI check stayed green.
  # scripts/check-desktop-package.mjs now asserts this file covers every local
  # import reachable from main.mjs.
  - "*.mjs"
  - preload.cjs
extraResources:
  # Ship the existing zero-dependency backend + UI unchanged under resources/backend.
  # "*.mjs" (not an explicit list) so new backend modules are picked up automatically.
  - from: ..
    to: backend
    filter:
      - "*.mjs"
      - package.json
      - public/**
  - from: assets/send-event.mjs.cmd
    to: backend/send-event.mjs.cmd
  # The statusline twin of the hook shim. Without it settings.statusLine keeps
  # pointing at "node <path>" on a machine that may have no system Node, so the
  # quota bars and the context rings never populate in an MSI install.
  # scripts/check-desktop-package.mjs asserts every assets/*.cmd is mapped here.
  - from: assets/statusline-feed.mjs.cmd
    to: backend/statusline-feed.mjs.cmd
win:
  target:
    - msi
  icon: build/icon.ico
msi:
  upgradeCode: "e5872abe-e77d-4efc-ae4b-636045d67e78"
  perMachine: false
  oneClick: false
  runAfterFinish: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Mission Control Center
