name: CI

# Lightweight gate for the mission control app: parse every backend/desktop
# module and boot the server against its real endpoints. Separate from the
# release MSI builder (fleet-desktop-msi.yml). Zero runtime deps, so there is
# nothing to install: just Node.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check every .mjs
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter *.mjs |
            Where-Object { $_.FullName -notmatch 'node_modules' }
          $failed = $false
          foreach ($f in $files) {
            node --check $f.FullName
            if ($LASTEXITCODE -ne 0) { Write-Error "syntax error: $($f.FullName)"; $failed = $true }
          }
          if ($failed) { exit 1 }
          Write-Host "checked $($files.Count) module(s)"

      - name: Server smoke test
        run: node scripts/smoke-server.mjs

      # Packaging guard: every local module main.mjs imports must be covered by
      # electron-builder's `files` list. 0.1.10 shipped dead without this because
      # a new module was imported but never packaged, and nothing else notices:
      # the repo copy works, and an MSI only fails at runtime after release.
      - name: Desktop packaging check
        run: node scripts/check-desktop-package.mjs

      # Real spawn of the updater's install command (this runner is Windows, so it
      # executes rather than skipping): asserts the MSI path reaches msiexec
      # unmangled by Node's and cmd.exe's quoting rules.
      - name: Updater install command check
        run: node scripts/check-installer-launch.mjs
